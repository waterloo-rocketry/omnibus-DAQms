name: CI

on:
    push:
        branches: [main]
        paths: [areas/apps/daqms/**]
    pull_request:
        paths: [areas/apps/daqms/**]

defaults:
    run:
        working-directory: areas/apps/daqms

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: areas/apps/daqms/package-lock.json
            - run: npm ci
            - run: npm run lint

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: areas/apps/daqms/package-lock.json
            - run: npm ci
            - run: npm run typecheck

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: areas/apps/daqms/package-lock.json
            - run: npm ci
            - run: npm run test

    format:
        name: Format Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: areas/apps/daqms/package-lock.json
            - run: npm ci
            - run: npm run format:check
